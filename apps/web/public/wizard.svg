<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Uncle Sam inspired TaskWish character</title>
<desc id="desc">A confident white-haired character in a tall charcoal top hat with an electric blue band, tailored coat, bow tie and pointed goatee, holding an electric blue tipped magic wand. No logos. Transparent background.</desc>
